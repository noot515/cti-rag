name: Evidence runtime foundation
on:
  push:
    branches:
      - feat/evidence-runtime-phase0-phase1-20260922
  pull_request:
    branches:
      - main
jobs:
  deterministic-evidence-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile side-effect-free runtime and chained gate modules
        run: |
          python -m compileall -q cti_rag scripts
          python -m py_compile tests/contracts_phase1_test.py tests/validation_runner_test.py tests/ports_policy_phase2_test.py tests/canonical_ingestion_phase3_test.py tests/snapshot_publication_phase4_test.py tests/exact_lexical_phase5_test.py
      - name: Run cumulative deterministic gates
        run: |
          python -m unittest tests.contracts_phase1_test tests.validation_runner_test tests.ports_policy_phase2_test tests.canonical_ingestion_phase3_test tests.snapshot_publication_phase4_test tests.exact_lexical_phase5_test -v
      - name: Verify cumulative registry remains fail-closed
        run: |
          set +e
          python scripts/validate_phases.py --through-phase 5 --report /tmp/cumulative-phase5.json
          rc=$?
          set -e
          test "$rc" -eq 1
          python - <<'PY'
          import json
          with open("/tmp/cumulative-phase5.json", "r", encoding="utf-8") as handle:
              report = json.load(handle)
          states = {gate["id"]: gate["status"] for gate in report["gates"]}
          assert report["status"] == "fail"
          assert states["phase4-snapshot-publication-invariants"] == "pass"
          assert states["phase5-exact-independent-lexical-invariants"] == "pass"
          assert states["phase0-legacy-fast-suite"] == "blocked"
          assert states["phase0-b0-offline-benchmark"] == "blocked"
          assert states["phase5-mysql-fulltext-real-service"] == "blocked"
          PY
