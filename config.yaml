# ThreatRAG 统一配置文件

# 功能开关
enable_reranker: true
enable_knowledge_base: true
enable_knowledge_graph: true
enable_web_search: true
enable_hybrid_retrieval: true

# Advanced retrieval remains opt-in. The direct application route is
# /chat/advanced-retrieval; any /api prefix must be supplied by a deployment proxy.
advanced_rag:
  enabled: false
  config_path: benchmark/advanced/configs/fixture.yaml
  proxy_prefix: ""

# 查询配置
use_rewrite_query: "on"  # 是否使用重写查询

# 模型配置
model_provider: "ollama"
model_name: "qwen3:30b"

embed_model: "dashscope/text-embedding-v4"

reranker: "zhipu/rerank"

# 设备配置
device: "cpu"

# FastAPI服务器配置
fastapi_server:
  host: 0.0.0.0
  port: 8000

# 向量数据库配置
vector_database:
  path: /app/data/vector_db

# 文件上传配置
file_upload:
  path: /app/data/file_uploads

# 模型路径配置
model:
  embedding_model:
    path: /app/data/embedding_model

# Milvus配置
milvus:
  auto_start: false
  data_dir: ./milvus_lite
  host: milvus-standalone
  port: 19530

# Neo4j配置
neo4j:
  auto_start: false
  data_dir: ./neo4j_data
  host: neo4j
  port: 7688
  http_port: 7474
  index_interval: 600
  index_batch_size: 200
  auto_index: true

rl_base_model_path: /app/models/reasoning_model/Qwen2.5-3B-Instruct
rl_lora_path: /app/models/reasoning_model/final_lora
rl_policy_checkpoint_path: /app/models/reasoning_model/rl_policy_path_match/best_policy.pt
rl_device: cpu
