name: cti-rag-advanced

services:
  advanced-milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    command: >-
      etcd -advertise-client-urls=http://advanced-milvus-etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - advanced_milvus_etcd:/etcd
    networks:
      - advanced_milvus_internal
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  advanced-milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    command: minio server /minio_data
    environment:
      MINIO_ACCESS_KEY: ${ADVANCED_MINIO_ACCESS_KEY:?ADVANCED_MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${ADVANCED_MINIO_SECRET_KEY:?ADVANCED_MINIO_SECRET_KEY is required}
    volumes:
      - advanced_milvus_minio:/minio_data
    networks:
      - advanced_milvus_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  advanced-milvus:
    image: milvusdb/milvus:v2.3.4
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: advanced-milvus-etcd:2379
      MINIO_ADDRESS: advanced-milvus-minio:9000
      MINIO_ACCESS_KEY_ID: ${ADVANCED_MINIO_ACCESS_KEY:?ADVANCED_MINIO_ACCESS_KEY is required}
      MINIO_SECRET_ACCESS_KEY: ${ADVANCED_MINIO_SECRET_KEY:?ADVANCED_MINIO_SECRET_KEY is required}
    volumes:
      - advanced_milvus_data:/var/lib/milvus
    ports:
      - "127.0.0.1:${ADVANCED_MILVUS_PORT:-19531}:19530"
      - "127.0.0.1:${ADVANCED_MILVUS_HEALTH_PORT:-9092}:9091"
    networks:
      - advanced_milvus_internal
    depends_on:
      advanced-milvus-etcd:
        condition: service_healthy
      advanced-milvus-minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

  advanced-neo4j:
    image: neo4j:5.15-community
    environment:
      NEO4J_AUTH: ${ADVANCED_NEO4J_USERNAME:?ADVANCED_NEO4J_USERNAME is required}/${ADVANCED_NEO4J_PASSWORD:?ADVANCED_NEO4J_PASSWORD is required}
      ADVANCED_NEO4J_USERNAME: ${ADVANCED_NEO4J_USERNAME:?ADVANCED_NEO4J_USERNAME is required}
      ADVANCED_NEO4J_PASSWORD: ${ADVANCED_NEO4J_PASSWORD:?ADVANCED_NEO4J_PASSWORD is required}
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
      NEO4J_server_http_listen__address: 0.0.0.0:7474
    volumes:
      - advanced_neo4j_data:/data
      - advanced_neo4j_logs:/logs
    ports:
      - "127.0.0.1:${ADVANCED_NEO4J_HTTP_PORT:-7475}:7474"
      - "127.0.0.1:${ADVANCED_NEO4J_BOLT_PORT:-7689}:7687"
    networks:
      - advanced_neo4j_internal
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u '$${ADVANCED_NEO4J_USERNAME}' -p '$${ADVANCED_NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1"]
      interval: 20s
      start_period: 45s
      timeout: 10s
      retries: 10

networks:
  advanced_milvus_internal:
    name: cti-rag-advanced-milvus-internal
    internal: true
  advanced_neo4j_internal:
    name: cti-rag-advanced-neo4j-internal
    internal: true

volumes:
  advanced_milvus_etcd:
    name: cti-rag-advanced-milvus-etcd
  advanced_milvus_minio:
    name: cti-rag-advanced-milvus-minio
  advanced_milvus_data:
    name: cti-rag-advanced-milvus-data
  advanced_neo4j_data:
    name: cti-rag-advanced-neo4j-data
  advanced_neo4j_logs:
    name: cti-rag-advanced-neo4j-logs
