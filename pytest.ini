[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    -m "not integration and not legacy_service and not opencti and not gpu and not live_model"
    --ignore=tests/test_ner.py
    --ignore=tests/test_milvus_fix.py
    --ignore=tests/model_router_test.py
    --ignore=tests/test_redis_runtime.py
    --ignore=tests/test_redis_session.py
    --ignore=tests/test_original_error.py
markers =
    asyncio: mark async tests
    integration: requires one or more local services
    opencti: requires an OpenCTI deployment
    gpu: requires a compatible GPU runtime
    live_model: performs real model/provider inference
    legacy_service: legacy service or executable-script validation; never a default offline unit gate
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
